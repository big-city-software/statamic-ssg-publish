name: Tests

on:
  push:
  pull_request:

jobs:
  php_tests:
    strategy:
      fail-fast: false
      matrix:
        php: [8.3, 8.4]
        laravel: [12.*, 13.*]
        os: [ubuntu-latest]

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, gd, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit
